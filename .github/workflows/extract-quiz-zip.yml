name: Extract quiz app ZIP into repository

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/extract-quiz-zip.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract all files without deleting existing files
        shell: bash
        run: |
          set -euo pipefail
          test -f quiz_app-updated.zip
          mkdir -p /tmp/quiz-app-extract
          unzip -q quiz_app-updated.zip -d /tmp/quiz-app-extract
          test -d /tmp/quiz-app-extract/repo-quiz-app
          cp -an /tmp/quiz-app-extract/repo-quiz-app/. .
          git status --short

      - name: Commit extracted files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new files to commit."
            exit 0
          fi
          git commit -m "Extract all quiz app files from ZIP"
          git push
